name: link-check

# Catches broken links in the site, e.g. finalis-core docs that were renamed or removed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude '^https://(x|twitter)\.com/'
            --exclude '^https://bitcointalk\.org/'
            index.html
          fail: true
